# Cloud Build: Next.js frontend → Cloud Run (DEV target).
#
# Use when redeploying poultrymaster-web-dev. The repo's `.env.production`
# pins PROD URLs by default — this yaml rewrites it inside the build context
# (NOT the local working copy) so the dev frontend bakes against dev APIs.
#
# Submit:
#   gcloud builds submit . --config=cloudbuild.web-dev.yaml
#
# Override _SERVICE_NAME, _NEXT_API, _NEXT_LOGIN if you point at a different
# dev / staging Cloud Run service.

substitutions:
  _REGION: europe-west1
  _SERVICE_NAME: poultrymaster-web-dev
  _AR_REPO_PATH: cloud-run-source-deploy
  _NEXT_API:    https://poultrymaster-farm-api-dev-t6tn7geswq-ew.a.run.app
  _NEXT_LOGIN:  https://poultrymaster-login-api-dev-t6tn7geswq-ew.a.run.app

steps:
  # Step 1: rewrite .env.production with the dev API URLs. This file lives
  # inside the Cloud Build workspace only; the local working copy is untouched.
  - name: gcr.io/cloud-builders/gcloud
    entrypoint: bash
    args:
      - -c
      - |
        cat > .env.production <<EOF
        NEXT_PUBLIC_API_BASE_URL=$_NEXT_API
        NEXT_PUBLIC_ADMIN_API_URL=$_NEXT_LOGIN
        NEXT_PUBLIC_LOGIN_API_URL=$_NEXT_LOGIN
        EOF
        echo "--- .env.production for this build ---"
        cat .env.production

  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO_PATH/$_SERVICE_NAME:$BUILD_ID
      - -t
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO_PATH/$_SERVICE_NAME:latest
      - --build-arg
      - NEXT_PUBLIC_API_BASE_URL=$_NEXT_API
      - --build-arg
      - NEXT_PUBLIC_ADMIN_API_URL=$_NEXT_LOGIN
      - --build-arg
      - NEXT_PUBLIC_LOGIN_API_URL=$_NEXT_LOGIN
      - -f
      - Dockerfile
      - .

  - name: gcr.io/cloud-builders/docker
    args: ["push", "$_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO_PATH/$_SERVICE_NAME:$BUILD_ID"]

  - name: gcr.io/cloud-builders/docker
    args: ["push", "$_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO_PATH/$_SERVICE_NAME:latest"]

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_SERVICE_NAME
      - --image=$_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO_PATH/$_SERVICE_NAME:$BUILD_ID
      - --region=$_REGION
      - --platform=managed
      - --port=8080
      - --allow-unauthenticated
      - --quiet

images:
  - $_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO_PATH/$_SERVICE_NAME:$BUILD_ID
  - $_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO_PATH/$_SERVICE_NAME:latest

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
