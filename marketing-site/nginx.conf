server {
    listen       8080;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # Static marketing site — fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long cache for static assets, short for the HTML entrypoint.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
