# Push to `dev` → redeploy poultrymaster-web-dev. (Cloud Build GitHub trigger)
#
# Same pipeline as poultrycore-main/cloudbuild.web-dev.yaml, which is written
# for `gcloud builds submit` FROM that folder. A GitHub trigger checks out the
# repo ROOT instead — that difference is why the old main trigger has failed on
# every push with `lstat /workspace/Dockerfile: no such file or directory`.
# This file lives at the root and steps set `dir:` to the app folder.
#
# DEV ONLY. It bakes the dev NEXT_PUBLIC_* URLs at build time; production
# stays a deliberate manual step (see the deploy runbook).

substitutions:
  _REGION: europe-west1
  _SERVICE_NAME: poultrymaster-web-dev
  _AR_REPO_PATH: cloud-run-source-deploy
  _NEXT_API:    https://poultrymaster-farm-api-dev-t6tn7geswq-ew.a.run.app
  _NEXT_LOGIN:  https://poultrymaster-login-api-dev-t6tn7geswq-ew.a.run.app

steps:
  - name: gcr.io/cloud-builders/gcloud
    dir: poultrycore-main
    entrypoint: bash
    args:
      - -c
      - |
        cat > .env.production <<EOF
        NEXT_PUBLIC_API_BASE_URL=$_NEXT_API
        NEXT_PUBLIC_ADMIN_API_URL=$_NEXT_LOGIN
        NEXT_PUBLIC_LOGIN_API_URL=$_NEXT_LOGIN
        EOF
        echo "--- .env.production for this build ---"
        cat .env.production

  - name: gcr.io/cloud-builders/docker
    dir: poultrycore-main
    args:
      - build
      - -t
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO_PATH/$_SERVICE_NAME:$BUILD_ID
      - -t
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO_PATH/$_SERVICE_NAME:latest
      - --build-arg
      - NEXT_PUBLIC_API_BASE_URL=$_NEXT_API
      - --build-arg
      - NEXT_PUBLIC_ADMIN_API_URL=$_NEXT_LOGIN
      - --build-arg
      - NEXT_PUBLIC_LOGIN_API_URL=$_NEXT_LOGIN
      - -f
      - Dockerfile
      - .

  - name: gcr.io/cloud-builders/docker
    args: ["push", "$_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO_PATH/$_SERVICE_NAME:$BUILD_ID"]

  - name: gcr.io/cloud-builders/docker
    args: ["push", "$_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO_PATH/$_SERVICE_NAME:latest"]

  # No --set-env-vars: the service's runtime env vars and bindings survive an
  # image-only deploy, which is the point.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_SERVICE_NAME
      - --image=$_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO_PATH/$_SERVICE_NAME:$BUILD_ID
      - --region=$_REGION
      - --platform=managed
      - --port=8080
      - --allow-unauthenticated
      - --quiet

images:
  - $_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO_PATH/$_SERVICE_NAME:$BUILD_ID
  - $_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO_PATH/$_SERVICE_NAME:latest

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
