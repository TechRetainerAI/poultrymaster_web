# Push to `dev` → redeploy poultrymaster-farm-api-dev. (Cloud Build GitHub trigger)
#
# poultrycore_Backend/cloudbuild.farm.yaml with two changes: steps carry
# `dir:` because a trigger checks out the repo root, and the service is the
# DEV one. Note the trigger path also dodges the manual-submit trap recorded
# in the repo notes: poultrycore_Backend/.gcloudignore strips PoultryFarmAPI/
# out of `gcloud builds submit` uploads, but a trigger clones the full repo,
# so the ignore file never applies here.

substitutions:
  _REGION: europe-west1
  _SERVICE_NAME: poultrymaster-farm-api-dev
  _AR_REPO_PATH: cloud-run-source-deploy/techretainerai-poultrymaster_api

steps:
  - name: gcr.io/cloud-builders/docker
    dir: poultrycore_Backend
    args:
      - build
      - -t
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO_PATH/$_SERVICE_NAME:$BUILD_ID
      - -t
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO_PATH/$_SERVICE_NAME:latest
      - -f
      - PoultryFarmAPI/Dockerfile
      - PoultryFarmAPI

  - name: gcr.io/cloud-builders/docker
    args: ["push", "$_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO_PATH/$_SERVICE_NAME:$BUILD_ID"]

  - name: gcr.io/cloud-builders/docker
    args: ["push", "$_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO_PATH/$_SERVICE_NAME:latest"]

  # Image-only deploy: env vars and the Cloud SQL binding on the service are
  # preserved, exactly as the manual dev deploys have relied on.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_SERVICE_NAME
      - --image=$_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO_PATH/$_SERVICE_NAME:$BUILD_ID
      - --region=$_REGION
      - --platform=managed
      - --port=8080
      - --allow-unauthenticated
      - --quiet

images:
  - $_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO_PATH/$_SERVICE_NAME:$BUILD_ID
  - $_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO_PATH/$_SERVICE_NAME:latest

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
