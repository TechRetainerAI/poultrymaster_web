# Cloud Build: Next.js Frontend → Artifact Registry → Cloud Run (web service)
#
# Default substitutions target the DEV web service; override _SERVICE_NAME and
# the three NEXT_PUBLIC_* URLs to deploy production:
#
#   # DEV (default):
#   gcloud builds submit . --config=cloudbuild.web.yaml \
#       --substitutions=_SERVICE_NAME=poultrymaster-web-dev
#
#   # PROD:
#   gcloud builds submit . --config=cloudbuild.web.yaml \
#       --substitutions=^|^_SERVICE_NAME=poultrymaster-web|_API_BASE_URL=https://poultrymaster-farm-api-git-t6tn7geswq-ew.a.run.app|_ADMIN_API_URL=https://poultrymaster-api-git-t6tn7geswq-ew.a.run.app|_LOGIN_API_URL=https://poultrymaster-api-git-t6tn7geswq-ew.a.run.app
#
# WHY the build-args matter (see Dockerfile:25-43 + memory env_production_trap):
# Next.js inlines NEXT_PUBLIC_* into the CLIENT bundle at build time. If you
# don't pass them here, the client falls back to DEFAULT_*_HOST in
# lib/api/default-api-hosts.ts, which are the PRODUCTION URLs — so the dev
# service silently calls the prod Farm/Login API. Always bake the right URLs.

substitutions:
  _REGION: europe-west1
  _SERVICE_NAME: poultrymaster-web-dev
  _AR_REPO_PATH: cloud-run-source-deploy/techretainerai-poultrymaster_api
  _API_BASE_URL:   https://poultrymaster-farm-api-dev-t6tn7geswq-ew.a.run.app
  _ADMIN_API_URL:  https://poultrymaster-login-api-dev-t6tn7geswq-ew.a.run.app
  _LOGIN_API_URL:  https://poultrymaster-login-api-dev-t6tn7geswq-ew.a.run.app

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - NEXT_PUBLIC_API_BASE_URL=$_API_BASE_URL
      - --build-arg
      - NEXT_PUBLIC_ADMIN_API_URL=$_ADMIN_API_URL
      - --build-arg
      - NEXT_PUBLIC_LOGIN_API_URL=$_LOGIN_API_URL
      - -t
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO_PATH/$_SERVICE_NAME:$BUILD_ID
      - -t
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO_PATH/$_SERVICE_NAME:latest
      - -f
      - Dockerfile
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO_PATH/$_SERVICE_NAME:$BUILD_ID

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO_PATH/$_SERVICE_NAME:latest

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - $_SERVICE_NAME
      - --image=$_REGION-docker.pkg.dev/$PROJECT_ID/$_AR_REPO_PATH/$_SERVICE_NAME:$BUILD_ID
      - --region=$_REGION
      - --platform=managed
      - --port=8080
      - --allow-unauthenticated
      - --quiet

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8   # Next.js build is heavyweight; small VM OOM-kills npm
